let TT='';const LINK='https://claude.ai/artifact/Q1JZnSvnvwfNym5HBby3MF';

function msg(){return '我的'+DOGS[di].n+'在《潦草遛狗大作戰》拿到「'+TT+'」，總好感 '+total+'！你敢來挑戰嗎？🐶 '+LINK}
function tm(t){const e=document.getElementById('tm');if(e)e.textContent=t}

function dl(){const a=document.createElement('a');a.href=mkCard().toDataURL('image/png');a.download='dog-card.png';a.click();tm('已存圖 💾')}

if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:msg()});return}
if(navigator.share){await navigator.share({text:msg()});return}}catch(e){if(e&&e.name=='AbortError')return}cp()}
function bg(){ctx.fillStyle=STG[si]?STG[si].bg:'#f6efe0';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=3;ctx.setLineDash([16,16]);

ctx.font='28px serif';ctx.textAlign='center';ctx.globalAlpha=.35;for(let i=0;i<6;i++){const y=((i*130+scroll*1.2)%(H+60))-30;ctx.fillText(i%2?'🌳':'🌼',i%2?18:342,y)}ctx.globalAlpha=1}
function hud(){ctx.fillStyle='#2b2b2b';ctx.font='bold 17px sans-serif';ctx.textAlign='left';ctx.fillText(STG[si].n,10,24);

function say(t,x,y,c){fx.push({t,x:Math.max(70,Math.min(W-70,x)),y,l:1.2,c})}
function show(h){ov.innerHTML='<div class="c">'+h+'</div>';ov.style.display='flex'}

function menu(){st='menu';si=0;total=0;show('<h1>🐶 潦草遛狗大作戰</h1><p>主人在滑手機，狗狗自己出任務！</p><p>👉 點左/右半邊（或 ←→）換跑道</p><p>🦴🍗💰 撿！　💩🧦🦀 閃！<br>👵👶 摸摸路人加好感</p><p>選你的狗狗 👇</p>'+dgs()+'<button onclick="startStage()">出發汪！</button><br><button class="sm" onclick="cpm()">📋 複製遊戲連結</button><p class="s" id="tm"></p>')}
function end(win){st='end';itx=null;EX=null;TS=1;FR=false;total+=Math.max(0,score);
if(!win){show('<h1>😵 牽繩被沒收</h1><p>「'+STG[si].n+'」好感不夠<br>主人說回家只能吃飼料</p><button onclick="startStage()">再來一次</button>')}
else if(si<STG.length-1){show('<h1>🎉 過關！</h1><p>「'+STG[si].n+'」好感 '+score+'<br>狗狗覺得自己是城市之王</p><button onclick="si++;startStage()">下一關</button>')}
else{const t=total>=260?'🏆 傳說級北爛神犬':total>=190?'😎 街頭巷尾傳奇':'🐕 還算可愛的路邊小狗';TT=t;show('<h1>🎊 全破！</h1><img src="'+mkCard().toDataURL()+'" style="width:48%;border:3px solid var(--ink);border-radius:8px"><br><button class="sm" onclick="sh()">📤 分享成績卡</button><button class="sm" onclick="dl()">💾 存圖</button><button class="sm" onclick="cp()">📋 複製連結</button><p class="s" id="tm"></p><button onclick="menu()">重玩</button>')}}
function hit(it){const [e,p,q]=it.d;score+=p;itx={it:it,t:0,d:1.7};EX=EXM[e.replace(/\uFE0F/g,'')]||'happy';for(let i=0;i<3;i++)fx.push({t:p>0?'💖':'💢',x:dx+(i-1)*34,y:DY-95,l:1.6,c:'#000'});MSG.unshift({t:(p>0?'+':'')+p+' '+pick(q),p:p});MSG.length=Math.min(3,MSG.length);hap=p>0?1:-1;setTimeout(()=>hap=0,600);if(p<0)shake=.25;
